<svg xmlns="http://www.w3.org/2000/svg" width="980" height="820" viewBox="0 0 980 820">
  <rect width="980" height="820" fill="#ffffff"/>
  <style>
    text { font-family: Arial, sans-serif; font-size: 16px; fill: #111; }
    .box { fill: #fffdf6; stroke: #222; stroke-width: 2; }
    .small { font-size: 13px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#222"/>
    </marker>
  </defs>

  <text x="36" y="40" font-size="22">Схема прототипов code.js</text>
  <text class="small" x="36" y="66">Стрелка ведёт к [[Prototype]]. Student.prototype после второй записи равен Person.prototype, функция readBook в цепочке не остаётся.</text>

  <rect class="box" x="70" y="100" width="110" height="44"/>
  <text x="125" y="128" text-anchor="middle">a</text>
  <rect class="box" x="250" y="100" width="110" height="44"/>
  <text x="305" y="128" text-anchor="middle">b</text>

  <rect class="box" x="90" y="220" width="250" height="64"/>
  <text x="215" y="246" text-anchor="middle">Person.prototype</text>
  <text x="215" y="268" text-anchor="middle">= Student.prototype</text>

  <rect class="box" x="90" y="390" width="190" height="48"/>
  <text x="185" y="420" text-anchor="middle">Object.prototype</text>

  <rect class="box" x="125" y="530" width="120" height="44"/>
  <text x="185" y="558" text-anchor="middle">null</text>

  <rect class="box" x="470" y="220" width="170" height="48"/>
  <text x="555" y="250" text-anchor="middle">Function.prototype</text>

  <rect class="box" x="720" y="110" width="130" height="44"/>
  <text x="785" y="138" text-anchor="middle">Person</text>
  <rect class="box" x="720" y="180" width="130" height="44"/>
  <text x="785" y="208" text-anchor="middle">Student</text>
  <rect class="box" x="720" y="250" width="130" height="44"/>
  <text x="785" y="278" text-anchor="middle">Function</text>
  <rect class="box" x="720" y="320" width="130" height="44"/>
  <text x="785" y="348" text-anchor="middle">Object</text>

  <line x1="125" y1="144" x2="170" y2="220" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="305" y1="144" x2="250" y2="220" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="185" y1="284" x2="185" y2="390" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="185" y1="438" x2="185" y2="530" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="720" y1="132" x2="640" y2="230" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="202" x2="640" y2="244" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="272" x2="640" y2="250" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="342" x2="640" y2="258" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="470" y1="268" x2="280" y2="414" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="small" x="36" y="740">a и b созданы через new, их [[Prototype]] — общий Person.prototype.</text>
  <text class="small" x="36" y="762">Person, Student, Function и Object — функции, их [[Prototype]] — Function.prototype.</text>
  <text class="small" x="36" y="784">Function.prototype.[[Prototype]] = Object.prototype, Object.prototype.[[Prototype]] = null.</text>
</svg>
